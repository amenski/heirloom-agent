# Minimal override over SearXNG's image defaults (use_default_settings
# merges the container's own settings.yml and applies only what's here).
#
# The placeholder secret_key below is a template marker ONLY: the
# docker-compose entrypoint guard replaces it with a fresh random value
# on first boot and persists the result back into this file. The instance
# never runs with the placeholder.
use_default_settings: true
server:
  secret_key: "CHANGE_ME_RUN_openssl_rand_hex_32"
search:
  formats:
    - html
    - json
