# Minimal override over SearXNG's image defaults (use_default_settings
# merges the container's own settings.yml and applies only what's here).
#
# TEMPLATE ONLY — this file is mounted read-only and never mutated. The
# placeholder secret_key is replaced at container start with a fresh
# random value rendered into a container-local settings file (see the
# docker-compose entrypoint). Safe to commit as-is.
use_default_settings: true
server:
  secret_key: "CHANGE_ME_RUN_openssl_rand_hex_32"
search:
  formats:
    - html
    - json
