# Optional local SearXNG instance — heirloom's self-hosted search backend.
#
# Bing RSS remains the keyless default; this compose is an additive
# convenience. The instance binds to 127.0.0.1 ONLY (localhost), so it is
# not reachable from your LAN. See README.md § "Better search (optional)"
# and docs/web-search-spec.md for the full story.
services:
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml
    # The shipped settings.yml carries a placeholder secret_key. On first
    # boot this guard replaces it with a fresh random value IN THE MOUNTED
    # FILE (python3 is guaranteed present in the image), so the instance
    # never runs with the placeholder — there is no skipped-step failure
    # mode. SearXNG's settings loader does NOT substitute ${ENV} values, so
    # env-injection is not an option for this image (verified 2026-08-15).
    entrypoint:
      - /bin/sh
      - -c
      - >-
        if grep -q CHANGE_ME_RUN_openssl_rand_hex_32 /etc/searxng/settings.yml; then
          SECRET=$$(python3 -c "import secrets; print(secrets.token_hex(32))");
          sed -i "s/CHANGE_ME_RUN_openssl_rand_hex_32/$${SECRET}/" /etc/searxng/settings.yml;
          echo "searxng: generated a fresh secret_key (persisted in searxng/settings.yml)";
        fi;
        exec /usr/local/searxng/entrypoint.sh
